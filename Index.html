<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剑网3创作工具中心</title>
  <style>
    :root {
      --page: #090b10;
      --panel: rgba(23, 27, 39, .96);
      --line: rgba(255, 255, 255, .1);
      --text: #f5f7fb;
      --muted: #9ca7bb;
      --accent-soft: rgba(139, 112, 255, .16);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 15% -10%, rgba(117, 86, 235, .32), transparent 34%), radial-gradient(circle at 90% 5%, rgba(67, 101, 184, .18), transparent 28%), var(--page);
    }
    .app { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 48px; }
    .topbar, .tool-card, .roadmap { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 18px 48px rgba(0, 0, 0, .26); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; font-weight: 800; background: linear-gradient(135deg, #a58eff, #6244e9); box-shadow: 0 8px 20px rgba(112, 79, 240, .4); }
    .brand strong { display: block; font-size: 15px; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status { color: #cfc4ff; font-size: 12px; }
    .hero { padding: 78px 0 48px; text-align: center; }
    .hero-badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; color: #d7ceff; font-size: 12px; border: 1px solid rgba(165, 142, 255, .36); border-radius: 999px; background: var(--accent-soft); }
    .hero-badge::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: #9d88ff; box-shadow: 0 0 12px #9d88ff; }
    h1 { max-width: 760px; margin: 22px auto 14px; font-size: clamp(32px, 5vw, 58px); letter-spacing: -.055em; line-height: 1.08; }
    .hero p { max-width: 600px; margin: 0 auto; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .tool-card { position: relative; min-height: 250px; padding: 24px; overflow: hidden; }
    .tool-card::after { position: absolute; top: -85px; right: -80px; width: 240px; height: 240px; content: ""; border-radius: 50%; background: radial-gradient(circle, rgba(142, 111, 255, .35), transparent 68%); pointer-events: none; }
    .tool-icon { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 13px; font-weight: 800; background: linear-gradient(135deg, #a58eff, #6244e9); box-shadow: 0 8px 20px rgba(112, 79, 240, .3); }
    .tool-card h3 { margin: 20px 0 8px; font-size: 20px; }
    .tool-card p { max-width: 390px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .tool-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 10px 14px; color: white; font-size: 13px; font-weight: 700; text-decoration: none; border-radius: 9px; background: linear-gradient(135deg, #9277ff, #6749ea); transition: transform .16s ease, box-shadow .16s ease; }
    .tool-link:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(104, 73, 234, .32); }
    .tool-link::after { content: "→"; font-size: 16px; }
    .roadmap { display: grid; min-height: 250px; place-items: center; padding: 24px; color: var(--muted); text-align: center; border-style: dashed; background: rgba(23, 27, 39, .58); }
    .roadmap-icon { margin-bottom: 12px; color: #b5a5ff; font-size: 30px; }
    .roadmap strong { display: block; color: #dbe0ec; font-size: 15px; }
    .roadmap small { display: block; max-width: 250px; margin-top: 7px; line-height: 1.6; }
    footer { margin-top: 22px; color: #6f788c; font-size: 12px; text-align: center; }
    @media (max-width: 680px) {
      .app { width: calc(100% - 24px); padding-top: 12px; }
      .topbar { padding: 12px; }
      .status { display: none; }
      .hero { padding: 58px 0 38px; text-align: left; }
      h1 { margin-top: 18px; }
      .hero p { margin: 0; }
      .tool-grid { grid-template-columns: 1fr; }
      .section-head { align-items: start; flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">JX</div><div><strong>剑网3创作工具中心</strong><span>统一入口 · 高效完成每一次制作</span></div></div>
      <span class="status">工具中心 · 01</span>
    </header>
    <section class="hero">
      <span class="hero-badge">创作工作流</span>
      <h1>从素材到成片，<br>让创作更专注。</h1>
      <p>在这里选择所需工具，快速进入独立工作台。后续新增的创作工具也会统一收纳在此。</p>
    </section>
    <section aria-labelledby="tools-title">
      <div class="section-head"><h2 id="tools-title">可用工具</h2><span>持续扩展中</span></div>
      <div class="tool-grid">
        <article class="tool-card">
          <div class="tool-icon">PS</div>
          <h3>模板海报工作台</h3>
          <p>从蒙版识别、图库填充到图层调节与图片导出，一站式完成模板海报制作。</p>
          <a class="tool-link" href="PSOnline/index.html">进入工作台</a>
        </article>
        <article class="roadmap"><div><div class="roadmap-icon">＋</div><strong>更多工具即将加入</strong><small>后续可在此添加新的子页面入口，保持统一的工作流体验。</small></div></article>
      </div>
    </section>
    <footer>JX3 Creative Tools Hub</footer>
  </main>
</body>
</html>
