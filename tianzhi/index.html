<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17253e">
  <meta name="description" content="天旨速能视频交付清单">
  <title>天旨速能 · 视频交付清单 · 客户端</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-role="client">
  <div id="app" class="app" hidden>
    <div id="demo-ribbon" class="demo-ribbon" hidden>本地演示模式 · 记录只保存在当前浏览器，不会与其他设备同步</div>
    <header class="hero" id="hero">
      <div class="hero-top">
        <div class="brand"><div class="brand-icon" id="brand-icon"></div><div class="brand-copy"><strong>天旨速能</strong><span>VIDEO DELIVERY RECORD</span></div></div>
        <div class="topbar-actions"><span class="portal-chip">客户端</span></div>
      </div>
      <div class="project-kicker">当前项目 / CURRENT PROJECT</div>
      <h1 class="project-title">视频制作清单</h1>
    </header>
    <div id="dashboard">
      <div class="summary">
        <div class="summary-cards">
          <div class="metric"><div class="metric-heading"><span class="metric-icon" id="count-icon"></span>终稿视频数量</div><div class="metric-number"><span id="count-num">0</span><small>个</small></div></div>
          <div class="metric"><div class="metric-heading"><span class="metric-icon blue" id="time-icon"></span>终稿累计总时长</div><div class="metric-number"><span id="time-num">0</span><small>秒</small></div><div class="metric-foot" id="time-foot">合计 00:00 · 0秒</div></div>
        </div>
        <div class="progress-panel"><div class="progress-main"><div class="progress-meta"><span>100 个终稿 · 交付进度</span><span><strong id="done-num">0</strong> / 100 个目标</span></div><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div><div class="progress-score" id="progress-percent">0%</div></div>
      </div>
      <main class="content">
        <div class="section-top"><h2 class="section-title">视频明细</h2></div>
        <div class="search"><span id="search-icon"></span><input id="search-input" type="search" placeholder="搜索主题、序号或周次" autocomplete="off"><button id="clear-search" class="clear-search" aria-label="清除搜索"></button></div>
        <div class="result-line"><span id="result-left">读取记录中</span><span>按视频序号排列</span></div>
        <div class="video-list" id="video-list"><div class="loading">正在加载视频清单…</div></div>
        <div class="copyright">TIANZHISUNENG · DELIVERY LOG</div>
      </main>
    </div>
    <main id="detail-page" class="content is-detail detail-page" hidden><button class="back-link" id="back-list">← 返回视频清单</button><div id="detail-body" class="loading">正在加载详情…</div><div class="copyright">TIANZHISUNENG · DELIVERY LOG</div></main>
  </div>
  <div id="video-player" class="video-overlay"><div class="video-player-box"><button class="player-close" id="close-player">关闭播放器 ✕</button><video id="native-player" controls playsinline preload="metadata"></video></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
